<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14041f">
  <title>NEON DUEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="weaponHud"><span id="wName">MÃOS</span></div>
    <div id="netHud"><span id="pingTxt"></span></div>
    <div id="roster"></div>
  </div>

  <div id="banner" class="hidden"><h2 id="bTitle"></h2><p id="bSub"></p></div>

  <div id="lobby" class="hidden">
    <div class="box">
      <h2>Sala online</h2>
      <p id="lobbyCount" class="lcount"></p>
      <div id="lobbyList"></div>
      <p id="lobbyHint" class="lhint"></p>
      <button id="btnStart" class="btn primary" disabled>Iniciar partida</button>
      <button id="btnLobbyLeave" class="btn danger">Sair da sala</button>
    </div>
  </div>

  <div id="pause" class="hidden">
    <div class="box">
      <h2>Pausado</h2>
      <button id="btnResume" class="btn primary">Voltar ao jogo</button>
      <button id="btnLeave" class="btn danger">Sair da partida</button>
    </div>
  </div>
