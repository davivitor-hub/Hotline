<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo com Mapa (Tecla Q)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }
    #gameCanvas {
      display: block;
      background: #222;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui">
    <p>Use <b>WASD</b> ou as <b>Setas</b> para mover o jogador.</p>
    <p>Pressione <b>Q</b> para abrir/fechar o Mapa.</p>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Mundo do jogo
    const WORLD_WIDTH = 2000;
    const WORLD_HEIGHT = 2000;

    // Estado das teclas
    const keys = {};

    // Estado do Mapa (Toggle com Q)
    let showMap = false;

    // Jogador
    const player = {
      x: WORLD_WIDTH / 2,
      y: WORLD_HEIGHT / 2,
      radius: 12,
      speed: 5,
      color: "#00ffcc"
    };

    // Objetos/Pontos de interesse no mapa
    const pointsOfInterest = [];
    for (let i = 0; i < 40; i++) {
      pointsOfInterest.push({
        x: Math.random() * WORLD_WIDTH,
        y: Math.random() * WORLD_HEIGHT,
        radius: 6,
        color: Math.random() > 0.5 ? "#ff4444" : "#ffcc00"
      });
    }

    // Controles de teclado
    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;

      // Alternar mapa com Q
      if (e.key.toLowerCase() === "q") {
        showMap = !showMap;
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Atualização da lógica
    function update() {
      if (keys["w"] || keys["arrowup"]) player.y -= player.speed;
      if (keys["s"] || keys["arrowdown"]) player.y += player.speed;
      if (keys["a"] || keys["arrowleft"]) player.x -= player.speed;
      if (keys["d"] || keys["arrowright"]) player.x += player.speed;

      // Limites do mundo
      player.x = Math.max(player.radius, Math.min(WORLD_WIDTH - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(WORLD_HEIGHT - player.radius, player.y));
    }

    // Renderização
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Câmera centralizada no jogador
      ctx.save();
      ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

      // Borda do mundo
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // Grade do mundo
      ctx.strokeStyle = "#2a2a2a";
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_WIDTH; x += 100) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD_HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < WORLD_HEIGHT; y += 100) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD_WIDTH, y);
        ctx.stroke();
      }

      // Desenhar pontos de interesse
      pointsOfInterest.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      // Desenhar Jogador
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#fff";
      ctx.stroke();

      ctx.restore();

      // --- RENDERIZAR O MAPA (Se ativado com Q) ---
      if (showMap) {
        drawMap();
      }
    }

    function drawMap() {
      const mapSize = 220; // Tamanho do mapa na tela (px)
      const padding = 20;
      const mapX = canvas.width - mapSize - padding;
      mapY = padding;

      // Fundo do Mapa
      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.fillRect(mapX, mapY, mapSize, mapSize);

      // Borda do Mapa
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;
      ctx.strokeRect(mapX, mapY, mapSize, mapSize);

      // Escala do mundo para o mapa
      const scaleX = mapSize / WORLD_WIDTH;
      const scaleY = mapSize / WORLD_HEIGHT;

      // Desenhar pontos de interesse no mapa
      pointsOfInterest.forEach(p => {
        const mx = mapX + p.x * scaleX;
        const my = mapY + p.y * scaleY;

        ctx.beginPath();
        ctx.arc(mx, my, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      // Desenhar o Jogador no mapa
      const px = mapX + player.x * scaleX;
      const py = mapY + player.y * scaleY;

      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();

      // Indicador no mapa
      ctx.fillStyle = "#fff";
      ctx.font = "12px sans-serif";
      ctx.fillText("MAPA (Q)", mapX + 8, mapY + 18);
    }

    // Loop do jogo
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
